- name: baseline_langgraph
  env_overrides:
    AGENT_RUNTIME: langgraph
    REASONING_PIPELINE_ENABLED: "true"
    LANGGRAPH_REASONING_ENABLED: "true"
    LANGGRAPH_WORKFLOW_ENABLED: "true"
  warmup: 1
  repetitions: 3
  adapter: direct
  json_only: true

- name: langgraph_more_context
  env_overrides:
    AGENT_RUNTIME: langgraph
    REASONING_PIPELINE_ENABLED: "true"
    LANGGRAPH_REASONING_ENABLED: "true"
    LANGGRAPH_WORKFLOW_ENABLED: "true"
    TOP_K: "10"
    RERANK_POOL_SIZE: "20"
    CONVERSATION_MAX_TOKENS: "8192"
  warmup: 1
  repetitions: 3
  adapter: direct
  json_only: true

- name: langgraph_tight_budget
  env_overrides:
    AGENT_RUNTIME: langgraph
    REASONING_PIPELINE_ENABLED: "true"
    LANGGRAPH_REASONING_ENABLED: "true"
    LANGGRAPH_WORKFLOW_ENABLED: "true"
    CONVERSATION_MAX_TOKENS: "2048"
  warmup: 1
  repetitions: 3
  adapter: direct
  json_only: true
